<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Accueil - TCG IUT</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="shared.css">
  <script src="shared.js"></script>
  <style>
    .logo { margin: 0; text-align: center; font-size: 34px; letter-spacing: 6px; text-transform: uppercase;
      background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .daily { text-align: center; position: relative; }
    .big { font-size: 54px; font-weight: bold; color: #3fc8e8; line-height: 1; position: relative; display: inline-block; }
    .big small { font-size: 20px; color: var(--text-muted); }
    .sub { font-size: 13px; margin: 6px 0 14px; }
    .streak { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; }
    .day { flex: 1; max-width: 56px; padding: 8px 0; border-radius: 10px; background: rgba(0,0,0,0.06);
      font-size: 11px; line-height: 1.3; }
    .day b { display: block; font-size: 13px; }
    .day.done { background: var(--grad); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.25); }
    .day.today { outline: 2px dashed #3fc8e8; }
    .float { position: absolute; left: 50%; top: 0; font-size: 28px; font-weight: bold; color: #f0b420;
      pointer-events: none; animation: rise 1.2s ease-out forwards; }
    @keyframes rise { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -70px); } }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .tile { text-decoration: none; text-align: center; color: var(--text-muted); padding: 14px;
      transition: transform 0.2s ease; }
    .tile:hover { transform: translateY(-4px) scale(1.02); }
    .tile h2 { margin: 12px 0 2px; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; }
    .tile p { margin: 0; font-size: 12px; }
    .tile-img { height: 170px; border-radius: 12px; background-size: cover; background-position: top center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
    .booster-tile { background-image: url('boutique.jpeg'); }
    /* --- index.html (dans <style>) --- */

    /* Modifier la classe casino-tile pour charger une image de fond */
    .casino-tile { 
      background-image: url('casino.jpeg'); /* Chemin de votre image Casino */
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    /* CSS pour la grande icône de pièce sur l'accueil */
    .daily .big {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px; /* Plus d'espace car le texte est gros */
    }

    .coin-icon-large {
      display: inline-block;
      width: 50px; /* Taille géante pour l'accueil */
      height: 50px;
      background-image: url('piece_tcg.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      /* Petite ombre pour la faire ressortir */
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }
  </style>
</head>
<body class="site" data-hud="home">
  <main class="wrap">
    <h1 class="logo">TCG IUT</h1>

    <section class="panel daily">
      <div class="big">
        <span class="coin-icon-large"></span> <!-- Nouvelle span pour l'icône -->
        <span data-pts>0</span>
        <small>pts</small>
      </div>
      <div class="sub">de quoi ouvrir <b id="nb-boosters">0</b> booster(s) · 10 pts par booster</div>
      <button class="btn" id="claim" type="button">…</button>
      <div class="sub" id="note" style="margin:12px 0 0"></div>
    </section>

    <div class="tiles">
      <a class="panel tile" href="boosters.html">
        <div class="tile-img booster-tile"></div>
        <h2>Boosters</h2><p>10 pts par booster</p>
      </a>
      <a class="panel tile" href="casino.html">
        <div class="tile-img casino-tile"></div>
        <h2>Casino</h2><p>Mise tes points !</p>
      </a>
    </div>
  </main>

  <script>
    /* --- Script dans index.html --- */
const $ = s => document.querySelector(s);
const claimBtn = $('#claim');

function paint() {
  const d = Wallet.daily();
  $('#nb-boosters').textContent = Math.floor(Wallet.get() / Wallet.COST);

  claimBtn.disabled = d.claimed;
  claimBtn.textContent = d.claimed ? 'Bonus du jour récupéré ✓' : 'Récupérer mes 75 points du jour';
  tick();
}

// Compte à rebours jusqu'à minuit (heure locale)
function tick() {
  const d = Wallet.daily();
  if (!d.claimed) { 
    $('#note').textContent = 'Reviens chaque jour pour récupérer tes points !'; 
    return; 
  }
  const now = new Date(), next = new Date(now); next.setHours(24, 0, 0, 0);
  const s = Math.max(0, Math.floor((next - now) / 1000));
  const p = n => String(n).padStart(2, '0');
  $('#note').textContent = `Prochain bonus (+75 pts) dans ${p(s / 3600 | 0)}:${p((s % 3600) / 60 | 0)}:${p(s % 60)}`;
  if (s === 0) paint();
}

claimBtn.addEventListener('click', () => {
  const from = Wallet.get();
  const r = Wallet.claim();
  if (!r) return;
  // Animation du compteur
  const el = document.querySelector('.big'), t0 = performance.now();
  const f = document.createElement('div');
  f.className = 'float'; f.textContent = `+${r.reward}`;
  el.appendChild(f); setTimeout(() => f.remove(), 1300);
  (function step(t) {
    const k = Math.min(1, (t - t0) / 900);
    document.querySelector('[data-pts]').textContent = Math.round(from + r.reward * k);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
});

window.addEventListener('wallet', paint);
setInterval(tick, 1000);
paint();
  </script>
</body>
</html>
